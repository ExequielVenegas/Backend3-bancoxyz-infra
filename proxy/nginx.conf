worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    # No registrar tokens, credenciales ni query strings.
    log_format minimal '$remote_addr $request_method $uri $status';
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_session_tickets off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 8081 ssl;
        server_name localhost;
        set $web http://bff-web:8081;
        location /api/web/ { proxy_pass $web; }
        location = /actuator/info { proxy_pass $web; }
        location = /actuator/health { proxy_pass $web; }
        location / { return 404; }
    }
    server {
        listen 9000 ssl;
        server_name localhost;
        set $auth http://auth-server:9000;
        location = /oauth2/token {
            limit_except POST { deny all; }
            proxy_pass $auth;
        }
        location = /oauth2/jwks {
            limit_except GET { deny all; }
            proxy_pass $auth;
        }
        location = /.well-known/oauth-authorization-server {
            limit_except GET { deny all; }
            proxy_pass $auth;
        }
        location = /actuator/health {
            limit_except GET { deny all; }
            proxy_pass $auth;
        }
        location / { return 404; }
    }
    server {
        listen 8082 ssl;
        server_name localhost;
        set $mobile http://bff-mobile:8082;
        location /api/mobile/ { proxy_pass $mobile; }
        location = /actuator/health { proxy_pass $mobile; }
        location = /actuator/info { proxy_pass $mobile; }
        location / { return 404; }
    }
    server {
        listen 8083 ssl;
        server_name localhost;
        set $atm http://bff-atm:8083;
        location /api/atm/ { proxy_pass $atm; }
        location = /actuator/health { proxy_pass $atm; }
        location = /actuator/info { proxy_pass $atm; }
        location / { return 404; }
    }
}
